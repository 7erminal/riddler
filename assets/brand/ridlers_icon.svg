  <circle cx="304" cy="235" r="8" fill="#22303C"/>
  <ellipse cx="357" cy="268" rx="47" ry="37" fill="#FFD3E0" stroke="#22303C" stroke-width="12"/>
  <ellipse cx="345" cy="268" rx="5" ry="9" fill="#22303C"/>
  <ellipse cx="369" cy="268" rx="5" ry="9" fill="#22303C"/>
