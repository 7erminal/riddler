  <circle cx="244" cy="145" r="35" fill="#FF9A76" stroke="#22303C" stroke-width="13"/>
  <path d="M244 126v38M233 135h17c7 0 8 10 0 10h-12c-8 0-7 11 0 11h17" fill="none" stroke="#22303C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

