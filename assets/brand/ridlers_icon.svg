  <path d="M398 168v22M387 179h22" stroke="#8FE8D3" stroke-width="9" stroke-linecap="round"/>
  <circle cx="386" cy="350" r="9" fill="#C7C8FF" stroke="#22303C" stroke-width="5"/>

  <!-- Curly tail and little feet sit behind the body. -->
  <path d="M126 274c-27-5-39 13-31 29 8 17 31 16 36 1 4-11-5-19-15-17" fill="none" stroke="#22303C" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
