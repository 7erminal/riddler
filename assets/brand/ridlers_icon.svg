  <rect x="282" y="345" width="58" height="66" rx="22" fill="#CBFBF1" stroke="#22303C" stroke-width="14"/>

  <!-- Round piggy bank body. -->
  <ellipse cx="244" cy="286" rx="143" ry="108" fill="#CBFBF1" stroke="#22303C" stroke-width="16"/>

  <!-- Coin slot and coin. -->
